# Two-node Community Edition cluster. __HOST_PORT__ is the port published on
# the host. Peers find each other by Docker DNS name; the host client uses
# the alternate address.

service {
	cluster-name __CLUSTER_NAME__
	proto-fd-max 1024
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
		alternate-access-address 127.0.0.1
		alternate-access-port __HOST_PORT__
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		interval 150
		timeout 10
		mesh-seed-address-port aerospike-pair-a 3002
		mesh-seed-address-port aerospike-pair-b 3002
	}

	fabric {
		address any
		port 3001
	}
}

namespace test {
	replication-factor 2
	default-ttl 0
	nsup-period 120
	storage-engine memory {
		data-size 512M
	}
}

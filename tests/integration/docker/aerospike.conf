# Single-node Enterprise server for integration tests.
# __HOST_PORT__ is the port published on the host. The process listens on 3000
# inside the container; Docker forwards __HOST_PORT__ to that listener.
# The feature key is the evaluation key shipped in the Enterprise image.

service {
	feature-key-file /etc/aerospike/features.conf
	cluster-name telemetry-it
	proto-fd-max 15000
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
		access-address 127.0.0.1
		access-port __HOST_PORT__
		alternate-access-address 127.0.0.1
		alternate-access-port __HOST_PORT__
	}

	heartbeat {
		mode mesh
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		port 3001
	}
}

namespace test {
	replication-factor 1
	default-ttl 0
	nsup-period 120
	storage-engine memory {
		data-size 512M
	}
}
